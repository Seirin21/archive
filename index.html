<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 18th Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --screen1-bg:#AECCE4;
    --screen2-bg:#123456;
    --screen3-bg:#29465B;
    --btn1-bg:#151B54;
    --btn1-hover:#4961E1;
    --btn2-bg:#566D7E;
    --btn2-hover:#36454F;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Poppins', sans-serif;
    overflow:hidden;
  }

  .screen{
    position:fixed; inset:0;
    display:none;
    width:100%; height:100%;
    overflow:hidden;
  }
  .screen.active{ display:block; }

  /* ================= SCREEN 1 ================= */
  #screen1{ background:var(--screen1-bg); }

  .headline{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    font-family:'Bubblegum Sans', cursive;
    font-size:55px;
    color:var(--btn1-bg);
    text-align:center;
    width:90%;
    z-index:20;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  }

  .gift-btn{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(-50%);
    width:50%;
    padding:16px 10px;
    font-size:16px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    letter-spacing:0.5px;
    color:#fff;
    background:var(--btn1-bg);
    border:none;
    border-radius:12px;
    cursor:pointer;
    z-index:20;
    transition:background 0.25s ease;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .gift-btn::after{
    content:"";
    display:inline-block;
    margin-left:6px;
    opacity:0;
    transition:opacity 0.25s ease, margin-left 0.25s ease;
  }
  .gift-btn:hover{ background:var(--btn1-hover); }
  .gift-btn:hover::after{
    content:">>";
    opacity:1;
    margin-left:8px;
  }

  /* ---- wiggle animation ---- */
  @keyframes wiggle{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  .wiggle{ animation:wiggle 3.2s ease-in-out infinite; transform-origin:50% 90%; }
  .wiggle-slow{ animation:wiggle 4.2s ease-in-out infinite; transform-origin:50% 90%; }

  /* ---- cinnamoroll-style pup, centered, largest ---- */
  .pup{
    position:absolute;
    top:22%;
    left:38%;
    transform:translateX(-50%);
    width:320px;
    z-index:15;
    animation:wiggle 3.6s ease-in-out infinite;
    transform-origin:50% 90%;
  }

  /* ---- decorative critters scattered around ---- */
  .critter{ position:absolute; z-index:10; }

  /* ---- confetti ---- */
  .confetti-piece{
    position:absolute;
    top:-5%;
    width:10px; height:14px;
    opacity:0.9;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(115vh) rotate(360deg); }
  }

  /* ================= SCREEN 2 ================= */
  #screen2{ background:var(--screen2-bg); }
 
  .video-box{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:1280px;
    max-width:88vw;
    aspect-ratio:1280/720;
    background:#0a1c2c;
    border:2px dashed #45607a;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .video-box video{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }
 
  .next-btn{
    position:absolute;
    bottom:5%;
    right:4%;
    width:10%;
    min-width:90px;
    padding:10px 6px;
    font-size:10px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    color:#fff;
    background:var(--btn2-bg);
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:background 0.25s ease;
    white-space:nowrap;
  }
  .next-btn::after{
    content:"";
    margin-left:0;
    opacity:0;
    transition:opacity 0.25s ease, margin-left 0.25s ease;
  }
  .next-btn:hover{ background:var(--btn2-hover); }
  .next-btn:hover::after{
    content:">>";
    opacity:1;
    margin-left:5px;
  }

/* ================= SCREEN 3 ================= */
#screen3{ background:var(--screen3-bg); }

  resize:none;
  outline:none;
  overflow-y:auto;
  line-height:1.5;
}
</style>
</head>

<script>
  function goTo(n){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen' + n).classList.add('active');
  }

  const colors = ['#FF8FA3','#FFD166','#8FE3CF','#4961E1','#AECCE4','#FFFFFF'];
  const layer = document.getElementById('confetti-layer');
  for(let i=0;i<45;i++){
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (4 + Math.random()*5) + 's';
    c.style.animationDelay = (Math.random()*6) + 's';
    c.style.width = (6 + Math.random()*6) + 'px';
    c.style.height = (10 + Math.random()*8) + 'px';
    layer.appendChild(c);
  }

  const videoInput = document.getElementById('videoInput');
  const videoPreview = document.getElementById('videoPreview');
  const uploadLabel = document.getElementById('uploadLabel');
  videoInput.addEventListener('change', function(e){
    const file = e.target.files[0];
    if(file){
      const url = URL.createObjectURL(file);
      videoPreview.src = url;
      videoPreview.style.display = 'block';
      uploadLabel.style.display = 'none';
    }
  });
</script>
